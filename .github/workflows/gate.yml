# Runs the publish gate (tools/gate.mjs) on GitHub's machines for every push to threejs and to any worker branch,
# so nobody has to run it on the coordinator's two cores. The result shows as a check on the commit; the table and
# screenshots are attached to the run as the "gate" artifact and the table is printed on the run's summary page.
name: gate
on:
  push:
    branches: [threejs, 'fork-*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'quick or full'
        default: full
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (Playwright drives the runner's own Chrome, so no browser download)
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: ffmpeg (the voice check measures loudness with it)
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Gate
        run: node tools/gate.mjs --${{ github.event.inputs.mode || 'full' }} --out gate-out
      - name: Built files up to date (while they are still committed)
        if: always()
        run: git diff --stat --exit-code -- game.js index.html sw.js three.js || echo "::warning::committed built files differ from a fresh build"
      - name: Table on the summary page
        if: always()
        run: cat gate-out/gate.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate
          path: gate-out
          retention-days: 14
