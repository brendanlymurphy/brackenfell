# Runs the publish gate (tools/gate.mjs) on GitHub's machines for every push to threejs and to any worker branch,
# so nobody has to run it on the coordinator's two cores. The result shows as a check on the commit; the table and
# screenshots are attached to the run as the "gate-1..6" artifacts (the gate runs as six jobs side by side, steps dealt out by how long they take) and the table is printed on the run's summary page.
name: gate
on:
  push:
    branches: [threejs, 'fork-*']
    # a push that changes only documents or the audit session's own scripts cannot change the game: no gate (each run is 100 machine-minutes)
    paths-ignore: ['docs/**', '**.md', 'test/audit/**']
  workflow_dispatch:
    inputs:
      mode:
        description: 'quick or full'
        default: full
# threejs gets the full gate on every push. A worker branch (fork-*) gets the quick subset on a push (a few minutes), because six
# sessions pushing full gates filled GitHub's 20 machines and a publish waited behind them; a worker runs the full gate on its
# branch when it reports a merge candidate:  gh workflow run gate --ref fork-NAME -f mode=full
# One run at a time per branch. A new push does NOT cancel the run in progress (workers who push often never saw a green result):
# it waits. GitHub keeps one waiting run per branch, so of several pushes made during a run only the newest is tested next.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (Playwright drives the runner's own Chrome, so no browser download)
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: ffmpeg (the voice check measures loudness with it)
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Gate
        run: node tools/gate.mjs --${{ github.event.inputs.mode || (github.ref == 'refs/heads/threejs' && 'full' || 'quick') }} --shard ${{ matrix.shard }}/6 --out gate-out
      - name: Table on the summary page
        if: always()
        run: cat gate-out/gate.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-${{ matrix.shard }}
          path: gate-out
          retention-days: 14
