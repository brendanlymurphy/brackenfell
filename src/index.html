<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14110d">
<title>Brackenfell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
/*__CSS__*/
</style>
</head>
<body>
<canvas id="view" aria-label="Brackenfell, a village you can walk through"></canvas>
<div id="touch"></div>
<div id="stick"><div id="knob"></div></div>

<div id="hud" hidden>
  <div id="compass" aria-hidden="true"><div id="ctrack"></div><div id="cneedle"></div></div>
  <div id="clock"></div>
  <div id="objective"></div>
  <div id="place"></div>
  <div id="toasts" aria-live="polite"></div>
  <button id="act" type="button" hidden><span id="actKey">E</span><span id="actLabel"></span></button>
  <button id="menuBtn" type="button" aria-label="Open journal and settings"><span></span><span></span><span></span></button>
  <div id="purse"></div>
  <div id="fps" hidden></div>
</div>

<section id="dialog" hidden aria-live="polite">
  <div id="dname"></div>
  <p id="dtext"></p>
  <div id="dopts"></div>
</section>

<section id="reader" hidden>
  <div class="sheet">
    <h2 id="rtitle"></h2>
    <p id="rtext"></p>
    <button id="rclose" type="button" class="btn">Close</button>
  </div>
</section>

<section id="menu" hidden>
  <div class="sheet">
    <nav id="tabs">
      <button type="button" data-tab="journal" class="on">Journal</button>
      <button type="button" data-tab="pack">Pack</button>
      <button type="button" data-tab="settings">Settings</button>
      <button type="button" id="mclose" aria-label="Close">Close</button>
    </nav>
    <div id="tab-journal" class="tab"></div>
    <div id="tab-pack" class="tab" hidden></div>
    <div id="tab-settings" class="tab" hidden>
      <label class="row" for="setQuality"><span>Detail</span>
        <select id="setQuality"><option value="auto">Auto</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></label>
      <label class="row" for="setSens"><span>Look speed</span><input id="setSens" type="range" min="0.4" max="2.2" step="0.1" value="1"></label>
      <label class="row" for="setVol"><span>Sound</span><input id="setVol" type="range" min="0" max="1" step="0.05" value="0.8"></label>
      <label class="row" for="setMusic"><span>Music</span><input id="setMusic" type="range" min="0" max="1" step="0.05" value="0.6"></label>
      <label class="row" for="setTime"><span>Time of day</span><input id="setTime" type="range" min="0" max="24" step="0.25" value="9.5"></label>
      <label class="row" for="setFlow"><span>Day length</span>
        <select id="setFlow"><option value="720">12 minutes</option><option value="1440">24 minutes</option><option value="360">6 minutes</option><option value="0">Stop the clock</option></select></label>
      <label class="row" for="setGfx"><span>Graphics engine</span>
        <select id="setGfx"><option value="webgpu">WebGPU (default)</option><option value="webgl">WebGL 2 (if things look wrong)</option></select></label>
      <label class="row check" for="setInvert"><span>Invert look up and down</span><input id="setInvert" type="checkbox"></label>
      <label class="row check" for="setFps"><span>Show frame rate</span><input id="setFps" type="checkbox"></label>
      <button id="resetBtn" type="button" class="btn ghost">Start the story over</button>
      <p id="diag"></p>
        <p id="credits">Built on Three.js. Surface scans from ambientCG, cgbookcase and Nobiax; villagers from Quaternius; their animations from Mesh2Motion. All public domain (CC0).</p>
    </div>
  </div>
</section>

<section id="title">
  <div class="inner">
    <p class="over">A highland village to wander</p>
    <h1>Brackenfell</h1>
    <p id="loadText">Waking the valley</p>
    <div id="bar"><i id="barFill"></i></div>
    <div id="startRow" hidden>
      <button id="startBtn" type="button" class="btn big">Enter the village</button>
      <button id="contBtn" type="button" class="btn big ghost" hidden>Continue your stay</button>
    </div>
    <p id="hint"></p>
    <p id="gpuNote" hidden></p>
    <p id="classic"><a href="classic/">Classic version</a> (the build before this one)</p>
  </div>
</section>
<div id="fade"></div>
<script src="__THREE__"></script>
<script src="__GAME__"></script>
</body>
</html>
